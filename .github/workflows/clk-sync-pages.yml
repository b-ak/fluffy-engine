# The CLK sync page moved to https://b-ak.github.io/dusty-clock/ (repo b-ak/dusty-clock).
# This keeps the old address, https://b-ak.github.io/fluffy-engine/clk/, working by
# publishing a redirect page there.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy CLK sync page redirect

on:
  push:
    branches: [main]
    paths:
      - hardware-designs/CLK/web/**
      - .github/workflows/clk-sync-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}clk/
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site/clk
          cp hardware-designs/CLK/web/index.html _site/clk/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
